<!DOCTYPE html>
<html lang="id">
<head>

<title>Supervisi Perencanaan Pembelajaran — UPTD SPF SD Negeri Lanas 1</title>

<style>
:root{
  --bg:#E9EDF1; --paper:#FFFFFF; --paper2:#F6F8FA;
  --ink:#15181C; --muted:#5B6673; --line:#D9E0E7;
  --merah:#1B4D7E; --merah-bg:#E9F0F7;
  --hijau:#1E6B4E; --hijau-bg:#E9F4EF;
  --biru:#9E2A2B; --biru-bg:#FAEDED;
  --amber:#8A5A0B; --amber-bg:#FBF1DF;
  --shadow:0 1px 0 rgba(21,24,28,.06), 0 6px 18px -12px rgba(21,24,28,.35);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --paper:#181C21; --paper2:#1E232A;
    --ink:#EDF1F5; --muted:#9AA6B3; --line:#2B323A;
    --merah:#8FBBE6; --merah-bg:#14202C;
    --hijau:#79C9A6; --hijau-bg:#152520;
    --biru:#E2807F; --biru-bg:#2B1C1D;
    --amber:#DDB05F; --amber-bg:#261F12;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --paper:#181C21; --paper2:#1E232A;
  --ink:#EDF1F5; --muted:#9AA6B3; --line:#2B323A;
  --merah:#8FBBE6; --merah-bg:#14202C;
  --hijau:#79C9A6; --hijau-bg:#152520;
  --biru:#E2807F; --biru-bg:#2B1C1D;
  --amber:#DDB05F; --amber-bg:#261F12;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
#app{max-width:680px;margin:0 auto;padding:0 14px 108px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.015em}
p{margin:0 0 10px}
a{color:var(--merah)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--merah);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;flex:none;border-radius:10px;background:var(--merah);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
:root[data-theme="dark"] .crest,
:root:not([data-theme="light"]) .crest{color:#0d1b28}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .crest{color:#fff}}
.top h1{font-size:15px}
.top .sub{font-size:12px;color:var(--muted);font-weight:500}
.iconbtn{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card.tight{padding:12px}
.sec-title{font-size:12px;font-weight:800;color:var(--muted);margin:22px 2px 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

.hero{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.hero-num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 14px;text-align:left;cursor:pointer;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tile .em{font-size:20px;line-height:1}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile:active{background:var(--paper2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:13px 16px;font-weight:600;cursor:pointer;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--merah);border-color:var(--merah);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0d1b28}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--biru);border-color:var(--biru)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper2);
  border:1px solid var(--line);border-radius:11px;padding:12px;min-height:48px}
textarea{min-height:86px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

.ind{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.ind .no{font-size:12px;font-weight:800;color:var(--merah)}
.ind .q{font-weight:600;margin:2px 0 4px}
.ind .ex{font-size:12px;color:var(--muted);margin-bottom:10px}
.scale{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);
  background:var(--paper2);border-radius:11px;padding:11px 8px;font-size:14px;font-weight:600;min-height:46px;cursor:pointer;text-align:center}
.opt input:checked + span{border-color:var(--merah);background:var(--merah-bg);color:var(--merah)}
.opt input:focus-visible + span{outline:3px solid var(--biru);outline-offset:2px}
.note{margin-top:10px}
.note input{min-height:44px;font-size:14px}

.steps{margin:12px 0 4px}
.steps .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--merah);border-radius:99px}
.steps .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

.list-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.list-item .t{font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.tag.ok{background:var(--hijau-bg);color:var(--hijau);border-color:transparent}
.tag.warn{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.tag.bad{background:var(--biru-bg);color:var(--biru);border-color:transparent}
.tag.info{background:var(--merah-bg);color:var(--merah);border-color:transparent}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.bars{margin-top:6px}
.barrow{margin:9px 0}
.barrow .bl{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.barrow .bt{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.barrow .bt i{display:block;height:100%;background:var(--merah);border-radius:99px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex}
.nav div{max-width:680px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;background:none;border:0;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--muted);border-radius:10px}
.nav button .em{font-size:19px;line-height:1}
.nav button[aria-current="page"]{color:var(--merah)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90%}

#print-area{display:none}
.report{background:#fff;color:#000;padding:18px;border-radius:var(--r);border:1px solid var(--line);font-size:13.5px}
.report h2{font-size:15px;text-align:center}
.report .kop{text-align:center;border-bottom:2.5px solid #000;padding-bottom:8px;margin-bottom:12px}
.report .kopimg{margin-bottom:12px}
.report .kopimg img{width:100%;height:auto;display:block}
.report .kopimg h2{margin:10px 0 0}
.kop-prev{border:1px dashed var(--line);border-radius:12px;padding:8px;background:#fff;margin:10px 0;text-align:center}
.kop-prev img{max-width:100%;height:auto;display:block;margin:0 auto}
.report table{font-size:12.5px}
.report th,.report td{border:1px solid #999;padding:5px 7px}
.report .ttd{margin-top:26px;display:flex;justify-content:space-between;text-align:center;font-size:12.5px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,.nav,.toast{display:none!important}
  #print-area{display:block!important}
  .report{border:0;padding:0;border-radius:0}
  .report .pagebreak{page-break-before:always}
}

/* =============== TEMA BARU: Indigo Neon =============== */
:root{--bg:#EDEFFB;--paper:#FFFFFF;--paper2:#F4F5FE;--ink:#12132B;--muted:#5E617E;--line:#DCDFF3;
  --merah:#2F36D6;--merah-bg:#E6E8FF;--hijau:#0F7B5F;--hijau-bg:#DFF5EC;--biru:#D6244B;--biru-bg:#FFE6EC;
  --amber:#9A5B00;--amber-bg:#FFF0D2;--lime:#C8F169;--coral:#FF5C7A;--deep:#12132B;--r:20px;
  --shadow:0 1px 2px rgba(18,19,43,.06),0 16px 30px -20px rgba(47,54,214,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0C1E;--paper:#15172E;--paper2:#1B1E3A;
  --ink:#ECEEFF;--muted:#9A9DC2;--line:#2A2D52;--merah:#98A0FF;--merah-bg:#1F2250;--hijau:#6FD9B3;--hijau-bg:#122A25;
  --biru:#FF8CA3;--biru-bg:#34131D;--amber:#E8B65A;--amber-bg:#2B2210;--deep:#070817}}
:root[data-theme="dark"]{--bg:#0B0C1E;--paper:#15172E;--paper2:#1B1E3A;--ink:#ECEEFF;--muted:#9A9DC2;--line:#2A2D52;
  --merah:#98A0FF;--merah-bg:#1F2250;--hijau:#6FD9B3;--hijau-bg:#122A25;--biru:#FF8CA3;--biru-bg:#34131D;
  --amber:#E8B65A;--amber-bg:#2B2210;--deep:#070817}
.hero-num,.lg-tag,.stat b{font-family:"Unbounded","Plus Jakarta Sans",sans-serif;font-weight:700}
h1,h2,h3{letter-spacing:-.02em}
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top))}
.top .crest{background:var(--deep)!important;color:var(--lime)!important;border-radius:13px;font-family:"Unbounded",sans-serif;font-size:12px}
.top h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl{min-width:0;flex:1}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:12px;background:var(--paper);color:var(--ink)}
.iconbtn+.iconbtn{margin-left:0}.top-row{gap:8px}
svg.ic{width:20px;height:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px var(--paper2)}
.dot.ok{background:#22C27A}.dot.busy{background:var(--amber);animation:pl 1s infinite}.dot.err{background:var(--biru)}
@keyframes pl{50%{opacity:.35}}
.hero-card{background:radial-gradient(circle at 92% 8%,rgba(200,241,105,.28) 0 70px,transparent 71px),
  radial-gradient(circle at 78% 112%,rgba(255,92,122,.4) 0 90px,transparent 91px),var(--deep);color:#fff;border:0;border-radius:28px;padding:22px}
.hero-card .hero-num{color:var(--lime);font-size:34px}.hero-card .muted{color:rgba(255,255,255,.72)}
.hero-card circle:first-of-type{stroke:rgba(255,255,255,.16)}
.hero-card .stat{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14)}
.hero-card .stat b{color:#fff;font-size:20px}.hero-card .stat span{color:rgba(255,255,255,.7)}
.grid .tile:first-child{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:0;
  background:var(--merah-bg);border-color:transparent}
.tile{border-radius:22px;min-height:112px;justify-content:space-between;gap:4px}
.tile .em{width:40px;height:40px;border-radius:13px;background:var(--merah-bg);color:var(--merah);display:grid;place-items:center}
.grid .tile:first-child .em{background:var(--merah);color:#fff}
.nav{left:50%;right:auto;transform:translateX(-50%);width:min(660px,calc(100% - 20px));bottom:max(10px,env(safe-area-inset-bottom));
  border:1px solid var(--line);border-radius:26px;padding:6px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 34px -16px rgba(18,19,43,.5)}
.nav button{border-radius:20px;padding:8px 2px}.nav button .em{display:grid}
.nav button[aria-current="page"]{background:var(--deep);color:var(--lime)}
.toast{bottom:96px}
.nav button{font-size:10.5px;min-width:0}
tr[data-act]:active{background:var(--paper2)}
.btn{border-radius:14px}.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--lime)!important}
.steps .bar i{background:linear-gradient(90deg,var(--merah),var(--coral))}
.login{position:fixed;inset:0;z-index:100;overflow:auto;display:grid;place-items:center;padding:22px 16px;
  background:radial-gradient(circle at 88% 6%,rgba(200,241,105,.9) 0 62px,transparent 63px),
  radial-gradient(circle at 6% 94%,rgba(255,92,122,.85) 0 96px,transparent 97px),var(--deep)}
.lg-wrap{width:100%;max-width:400px}
.lg-tag{color:#fff;font-size:24px;line-height:1.25;margin:0 2px 20px}
.lg-card{background:var(--paper);border-radius:28px;padding:26px 22px;box-shadow:0 30px 60px -28px rgba(0,0,0,.75)}
.lg-card .crest{width:50px;height:50px;border-radius:16px;background:var(--deep);color:var(--lime);font-family:"Unbounded",sans-serif;margin-bottom:14px}
.lg-card h1{font-size:18px}.lg-err{color:var(--biru);font-size:13px;font-weight:600;margin:12px 0 0}
.lg-st{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--muted)}
details.lg-cfg{margin-top:10px;font-size:13px}details.lg-cfg summary{cursor:pointer;color:var(--muted)}
</style>

<script>
"use strict";
/* ============================ UTIL ============================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num = v => (v===""||v==null||isNaN(v))?0:Number(v);
function tglID(iso){if(!iso)return "-";const d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;
  const H=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],B=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return H[d.getDay()]+", "+d.getDate()+" "+B[d.getMonth()]+" "+d.getFullYear();}
function tglPendek(iso){if(!iso)return "-";const p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function tglResmi(iso){if(!iso)return "-";const d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;
  const B=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return d.getDate()+" "+B[d.getMonth()]+" "+d.getFullYear();}
function tglLokal(d){d=d||new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

const BAGIAN_KEYS = ["bagianA","bagianB","bagianC","bagianD"];
const aktifBagian = k => S.instrumen[k].filter(x=>x.aktif);
const skorTertinggi = ()=>Math.max(4,...S.instrumen.skala.map(x=>num(x.n)));

function hitung(o){
  let total=0, maxTot=0; const per={};
  BAGIAN_KEYS.forEach(k=>{
    const arr=aktifBagian(k); const skorKey="skor"+k.slice(6);
    const skor = arr.reduce((s,i)=>s+num(o[skorKey]&&o[skorKey][i.id]),0);
    const mx = arr.length*4;
    per[k] = {skor,maks:mx,persen: mx? Math.round((skor/mx)*1000)/10 : 0, n:arr.length};
    total+=skor; maxTot+=mx;
  });
  const persen = maxTot? Math.round((total/maxTot)*1000)/10 : 0;
  return {per,total,maxTot,persen,kategori:kategoriDari(persen)};
}
function kategoriDari(p){
  const k = S.instrumen.kategori.slice().sort((a,b)=>b.min-a.min);
  for(const x of k){ if(p>=num(x.min)) return x; }
  return k[k.length-1]||{label:"-",warna:""};
}

const CONTOH_UMUM = "Tulis secara spesifik bagian mana dalam dokumen yang menjadi dasar penilaian ini.";
function huruf(t){t=String(t||"");return t.charAt(0).toUpperCase()+t.slice(1);}
function aspekDari(x){
  const p=PANDUAN[x.id]; if(p&&p.a) return p.a;
  let t=String(x.teks||"").trim().replace(/[.\s]+$/,"");
  const k=t.indexOf(":"); if(k>0&&k<40) t=t.slice(0,k);
  if(t.length>70){ t=t.slice(0,70); const j=t.lastIndexOf(" "); if(j>30) t=t.slice(0,j); }
  if(!/^[A-Z]{2}/.test(t)) t=t.charAt(0).toLowerCase()+t.slice(1);
  return t;
}
function contohDari(x){ const p=PANDUAN[x.id]; return (p&&p.c)||CONTOH_UMUM; }
function teksCatatan(x,skor){
  const a=huruf(aspekDari(x)), top=skorTertinggi(), n=num(skor);
  if(!n) return "";
  if(n>=top) return a+" sudah dirancang lengkap, jelas, dan sangat sesuai; layak menjadi contoh praktik baik penyusunan perangkat.";
  if(n===top-1) return a+" sudah dirancang dengan baik dan sesuai kebutuhan; masih ada bagian kecil yang dapat disempurnakan.";
  if(n===top-2) return a+" baru dirancang sebagian dan belum sepenuhnya sesuai; perlu perbaikan dan pendampingan penyusunan.";
  return a+" belum tampak atau baru sedikit termuat dalam dokumen; perlu pendampingan langsung dalam penyusunannya.";
}
function daftarIndikator(){ return BAGIAN_KEYS.flatMap(k=>aktifBagian(k).map(x=>({k,x}))); }
function skorKeyOf(k){ return "skor"+k.slice(6); }
function catKeyOf(k){ return "cat"+k.slice(6); }

function terapkanCatatan(k,id,paksa){
  const x=S.instrumen[k].find(i=>i.id===id); if(!x) return false;
  const skor=num(draft[skorKeyOf(k)]&&draft[skorKeyOf(k)][id]); if(!skor) return false;
  draft[catKeyOf(k)]=draft[catKeyOf(k)]||{};
  if(!paksa && draft[catKeyOf(k)][id]) return false;
  draft[catKeyOf(k)][id]=teksCatatan(x,skor); return true;
}
function isiCatatanSemua(keys){
  let n=0; keys.forEach(k=>{ aktifBagian(k).forEach(x=>{ if(terapkanCatatan(k,x.id,false)) n++; }); });
  return n;
}
function umumOtomatis(d){ return daftarIndikator().some(({k,x})=>num(d[skorKeyOf(k)]&&d[skorKeyOf(k)][x.id])>0); }
function isiUmumOtomatis(paksa){
  if(!umumOtomatis(draft)) return false;
  const h=hitung(draft);
  const kuat=[], lemah=[];
  daftarIndikator().forEach(({k,x})=>{
    const s=num(draft[skorKeyOf(k)]&&draft[skorKeyOf(k)][x.id]); if(!s) return;
    const top=skorTertinggi();
    if(s>=top-1) kuat.push(aspekDari(x)); else if(s<=top-2) lemah.push(aspekDari(x));
  });
  const catatanUmum = "Perencanaan pembelajaran yang disusun "+draft_guruNama()+" memperoleh skor "+h.persen+"% dengan kategori \""+h.kategori.label+"\". "
    + (h.persen>=80 ? "Secara umum dokumen sudah tersusun sesuai ketentuan dan siap diterapkan di kelas."
       : h.persen>=70 ? "Dokumen sudah menunjukkan kelengkapan yang cukup, namun beberapa komponen masih perlu disempurnakan."
       : "Dokumen memerlukan pembinaan lebih lanjut agar seluruh komponen perencanaan pembelajaran terpenuhi.");
  const kekuatan = kuat.length? "Kekuatan dokumen terlihat pada "+sebut(kuat)+"." : "Belum ada komponen yang menonjol pada penilaian ini.";
  const area = lemah.length? "Area yang perlu dikembangkan meliputi "+sebut(lemah)+"." : "Tidak ada area yang menonjol perlu perbaikan segera.";

    : "Pertahankan kualitas penyusunan perangkat pembelajaran dan dapat dijadikan rujukan/contoh bagi rekan sejawat.";
  const au={catatanUmum,kekuatan,area,rekomendasi};
  if(paksa || !draft.autoUmum){ Object.assign(draft,au); draft.autoUmum=au; return true; }

}

function parseISO(s){ return new Date(s+"T00:00:00"); }
function nextWork(iso){ const d=parseISO(iso); while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1); return tglLokal(d); }
function addWork(iso,n){ const d=parseISO(iso); let c=0; while(c<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) c++; } return tglLokal(d); }

function buatPutaran(sem,ta,ke,mulai,jam){
  const out=[]; if(!S.guru.length) return out;
  let d=nextWork(mulai); const pra=[];
  S.guru.forEach(()=>{ pra.push(d); d=addWork(d,1); });
  let o=addWork(pra[pra.length-1],5); const obs=[];
  S.guru.forEach(()=>{ obs.push(o); o=addWork(o,1); });
  S.guru.forEach((g,i)=>{
    const mk=(tahap,tgl,j)=>({id:uid("j"),guruId:g.id,semester:sem,ta,ke,tahap,tanggal:tgl,jam:j,ket:"",status:"Terjadwal"});
    out.push(mk("pra",pra[i],jam[0]), mk("obs",obs[i],jam[1]), mk("pasca",addWork(obs[i],1),jam[2]));
  });
  return out;
}
/* Awal putaran berikutnya: sesuai jarak minggu dari awal putaran sebelumnya, tetapi tidak sebelum putaran sebelumnya selesai. */
function mulaiPutaranBerikut(prev,jarak){
  const t=prev.map(j=>j.tanggal).filter(Boolean).sort();
  const a=addWork(t[0],jarak*5), b=addWork(t[t.length-1],5);
  return a>b?a:b;
}
function buatJadwalOtomatis(sem,ta,mulai,jam,jumlah,jarak){
  const out=[]; jumlah=Math.max(minSup(),parseInt(jumlah)||minSup()); jarak=Math.max(1,parseInt(jarak)||jarakSup());
  for(let ke=1;ke<=jumlah;ke++){
    const start = ke===1? mulai : mulaiPutaranBerikut(out.filter(j=>j.ke===ke-1),jarak);
    out.push(...buatPutaran(sem,ta,ke,start,jam));
  }
  return out;
}

function ring(persen,warna){
  const R=30,C=2*Math.PI*R, off=C-(Math.min(100,Math.max(0,persen))/100)*C;
  const col = warna==="ok"?"var(--hijau)":warna==="warn"?"var(--amber)":warna==="bad"?"var(--biru)":"var(--merah)";
  return `<svg width="76" height="76" viewBox="0 0 76 76">
   <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/>
   <circle cx="38" cy="38" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
     stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 38 38)"/>
  </svg>`;
}

function prosesKop(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Berkas harus berupa gambar (JPG/PNG)"); return; }
  if(file.size>8*1024*1024){ toast("Ukuran gambar maksimal 8 MB"); return; }
  const fr=new FileReader();
  fr.onerror=()=>toast("Gambar tidak dapat dibaca");
  fr.onload=()=>{ const img=new Image();
    img.onerror=()=>toast("Gambar tidak dapat dibuka");
    img.onload=async()=>{
      const nw=img.naturalWidth||1400, nh=img.naturalHeight||200; let out="";
      for(const w0 of [1400,1100,800]){ const W=Math.min(w0,nw), H=Math.max(1,Math.round(nh*W/nw));
        const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
        x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.drawImage(img,0,0,W,H);
        let ok=false; for(const q of [.9,.8,.7,.6]){ out=c.toDataURL("image/jpeg",q); if(out.length<=300000){ ok=true; break; } }
        if(ok) break; }
      simpanPengaturan(true); S.settings.kopGambar=out; saveLocal(); render();
      await persist("settings"); toast("Kop tersimpan"); };
    img.src=fr.result; };
  fr.readAsDataURL(file);
}
document.addEventListener("change", e=>{
  if(e.target.id==="kop-file"){ prosesKop(e.target.files&&e.target.files[0]); e.target.value=""; return; }

    const ada=(draft.tl.jenis.length&&draft.tl.jenis.join("|")!==au.jenis)||(draft.tl.rekomendasi&&draft.tl.rekomendasi!==au.rekomendasi)||(draft.tl.target&&draft.tl.target!==au.target);
    if(ada && !confirm("Isian yang sudah Anda ubah akan diganti. Lanjutkan?")) return;
    isiTLOtomatis(true); render(); return; }
  if(act==="cat-auto"){
    if(!terapkanCatatan(b.dataset.kind,id,true)) toast("Pilih jawaban untuk indikator ini terlebih dahulu");
    render(); return; }
  if(act==="cat-auto-semua"){
    const n=isiCatatanSemua([b.dataset.kind]);
    toast(n? n+" catatan terisi" : "Belum ada jawaban baru atau catatan sudah terisi");
    render(); return; }

  if(act==="step-prev"){ step--; render(); return; }
  if(act==="step-next"){
    if(step===1){
      if(!draft.guruId){ toast("Pilih guru terlebih dahulu"); return; }
    }
    if(step===5){
      const i=S.sup.findIndex(o=>o.id===draft.id);
      draft.diubah=new Date().toISOString();
      if(i>=0) S.sup[i]=JSON.parse(JSON.stringify(draft)); else S.sup.push(JSON.parse(JSON.stringify(draft)));
      await persist("sup"); toast("Supervisi tersimpan");
    }
    step++; render(); return;
  }
  if(act==="obs-baru"){ draft=null; step=1; go("supervisi"); return; }
  if(act==="obs-edit"){ draft=null; go("supervisi", id); return; }
  if(act==="obs-hapus"){ if(!confirm("Hapus data supervisi ini?")) return;
    S.sup=S.sup.filter(o=>o.id!==id); await persist("sup"); go("riwayat"); return; }

  if(act==="cetak"){ const o=S.sup.find(x=>x.id===id); if(!o) return;
    $("#print-area").innerHTML=laporanHTML(o); setTimeout(()=>window.print(),60); return; }
  if(act==="cetak-rekap"){ $("#print-area").innerHTML=rekapHTML(); setTimeout(()=>window.print(),60); return; }

  if(act==="pin-cek"){ if($("#pin").value===String(S.settings.pinAdmin)){ adminOK=true; render(); }
    else toast("PIN belum cocok"); return; }

  if(act==="kat-tambah"){ simpanPengaturan(true); S.instrumen.kategori.push({min:0,label:"Kategori baru",warna:"warn"}); render(); return; }
  if(act==="kat-hapus"){ simpanPengaturan(true); S.instrumen.kategori.splice(Number(b.dataset.i),1); render(); return; }
  if(act==="ind-tambah"){ simpanPengaturan(true);
    S.instrumen[b.dataset.k].push({id:uid("i"),teks:"Indikator baru",aktif:true}); render(); return; }
  if(act==="ind-hapus"){ simpanPengaturan(true);
    S.instrumen[b.dataset.k].splice(Number(b.dataset.i),1); render(); return; }
  if(act==="set-simpan"){ simpanPengaturan(); await persist(); toast("Pengaturan tersimpan"); render(); return; }

  if(act==="backup"){
    const data=JSON.stringify(S,null,2);
    const nama="cadangan-supervisi-"+S.settings.taAktif.replace("/","-")+".json";
    let dl=null; try{ dl = window.claude&&claude.use ? await claude.use("downloads") : null; }catch(err){}
    if(dl){ try{ await dl.save({filename:nama,data}); toast("Cadangan diunduh"); }catch(err){ toast("Unduhan dibatalkan"); } }
    else {
      const w=document.createElement("textarea"); w.value=data;
      const box=document.createElement("div"); box.className="card";
      box.innerHTML="<b>Salin teks berikut dan simpan sebagai berkas .json</b>";
      box.appendChild(w); $("#app").appendChild(box); w.select();
    }
    return;
  }
  if(act==="restore"){
    const teks=prompt("Tempelkan isi berkas cadangan (JSON):");
    if(!teks) return;
    try{ const d=JSON.parse(teks);
      if(!d.settings||!d.guru) throw new Error("bentuk data tidak dikenali");
      S.settings=Object.assign({},DEF_SETTINGS,d.settings); S.guru=d.guru; S.instrumen=d.instrumen||S.instrumen; S.sup=d.sup||[]; S.jadwal=d.jadwal||[];
      await persist(); toast("Data dipulihkan"); render();
    }catch(err){ alert("Cadangan tidak dapat dibaca: "+err.message); }
    return;
  }
  if(act==="reset"){
    if(!confirm("Semua data supervisi, guru, dan instrumen akan dikembalikan ke kondisi awal. Lanjutkan?")) return;
    S.settings=JSON.parse(JSON.stringify(DEF_SETTINGS)); S.guru=JSON.parse(JSON.stringify(DEF_GURU));
    S.instrumen=JSON.parse(JSON.stringify(DEF_INSTRUMEN)); S.sup=[]; S.jadwal=[];
    await persist(); adminOK=false; go("beranda"); return;
  }
});
function simpanPengaturan(diam){
  $$("[data-set]").forEach(el=>{ S.settings[el.dataset.set]=el.value; });
  $$("[data-set-list]").forEach(el=>{ S.settings[el.dataset.setList]=el.value.split(",").map(x=>x.trim()).filter(Boolean); });
  $$("[data-kat]").forEach(el=>{ const [i,f]=el.dataset.kat.split("."); if(S.instrumen.kategori[i]) S.instrumen.kategori[i][f]= f==="min"?num(el.value):el.value; });
  $$("[data-skala]").forEach(el=>{ const [i,f]=el.dataset.skala.split("."); if(S.instrumen.skala[i]) S.instrumen.skala[i][f]= f==="n"?num(el.value):el.value; });
  $$("[data-ind]").forEach(el=>{ const p=el.dataset.ind.split("."); const k=p[0], i=Number(p[1]); if(S.instrumen[k]&&S.instrumen[k][i]) S.instrumen[k][i].teks=el.value; });
  $$("[data-ind-aktif]").forEach(el=>{ const p=el.dataset.indAktif.split("."); const k=p[0], i=Number(p[1]); if(S.instrumen[k]&&S.instrumen[k][i]) S.instrumen[k][i].aktif=el.checked; });
  if(!diam) saveLocal();
}
window.addEventListener("beforeprint", ()=>{ if(!$("#print-area").innerHTML && route==="detail"){
  const o=S.sup.find(x=>x.id===param); if(o) $("#print-area").innerHTML=laporanHTML(o); }});

/* ============================ START ============================ */
loadLocal();
render();
initData();
</script>
